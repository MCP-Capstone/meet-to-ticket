<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="meet-to-ticket 시스템 구성도">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6b8c"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- 1행: 화면, API, Agent, LLM -->
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <rect x="20" y="70" width="120" height="60" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="80" y="96" font-weight="700">사용자 브라우저</text><text x="80" y="115" font-size="11.5" fill="#4b5563">업로더, 담당자</text>

    <rect x="170" y="70" width="140" height="60" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="240" y="96" font-weight="700">frontend</text><text x="240" y="115" font-size="11.5" fill="#4b5563">React, Vite :5173</text>

    <rect x="340" y="70" width="170" height="60" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="425" y="96" font-weight="700">backend</text><text x="425" y="115" font-size="11.5" fill="#4b5563">Spring Boot :8080</text>

    <rect x="570" y="70" width="190" height="60" rx="8" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="2"/>
    <text x="665" y="96" font-weight="700">agent</text><text x="665" y="115" font-size="11.5" fill="#4b5563">FastAPI, LangGraph :8001</text>

    <rect x="800" y="70" width="140" height="60" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="870" y="96" font-weight="700">OpenAI API</text><text x="870" y="115" font-size="11.5" fill="#4b5563">LLM, 임베딩</text>
  </g>

  <!-- 2행: 저장소, 큐, MCP 서버 -->
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <rect x="300" y="210" width="110" height="56" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="355" y="234" font-weight="700">PostgreSQL</text><text x="355" y="252" font-size="11.5" fill="#4b5563">:5432</text>

    <rect x="430" y="210" width="150" height="56" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="505" y="234" font-weight="700">RabbitMQ :5672</text><text x="505" y="252" font-size="11.5" fill="#4b5563">분석 접수 큐, DLQ</text>

    <rect x="600" y="210" width="150" height="60" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="675" y="234" font-weight="700">business-mcp :8000</text><text x="675" y="253" font-size="11.5" fill="#4b5563">발행, 조회 도구</text>

    <rect x="780" y="210" width="150" height="60" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="855" y="234" font-weight="700">rag-mcp :8002</text><text x="855" y="253" font-size="11.5" fill="#4b5563">유사 이슈 검색</text>
  </g>

  <!-- 3행: 외부 서비스, 색인 -->
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <rect x="570" y="340" width="210" height="56" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="675" y="364" font-weight="700">GitHub / Notion / Slack</text><text x="675" y="382" font-size="11.5" fill="#4b5563">이슈, 페이지, 회의 결과 공지</text>

    <rect x="800" y="340" width="130" height="56" rx="8" fill="#f5f7fb" stroke="#5b6b8c" stroke-width="1.25"/>
    <text x="865" y="364" font-weight="700">Chroma 색인</text><text x="865" y="382" font-size="11.5" fill="#4b5563">기존 이슈 임베딩</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#5b6b8c" stroke-width="1.25" fill="none" marker-end="url(#arrow)">
    <path d="M140 100H168"/>
    <path d="M310 100H338"/>
    <path d="M395 130L360 208"/>
    <path d="M455 130L495 208"/>
    <path d="M510 86H568"/>
    <path d="M568 116H512"/>
    <path d="M760 100H798"/>
    <path d="M640 130L660 208"/>
    <path d="M720 130L830 208"/>
    <path d="M675 270V338"/>
    <path d="M855 270L862 338"/>
    <path d="M790 262L740 338" stroke-dasharray="5 4"/>
    <path d="M905 208V132"/>
  </g>

  <!-- 번호 -->
  <style>.n circle { fill: #2b5fd9; }</style>
  <g class="n" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">
    <g>
      <circle cx="154" cy="88" r="9"/><text x="154" y="92">1</text>
      <circle cx="324" cy="88" r="9"/><text x="324" y="92">2</text>
      <circle cx="368" cy="170" r="9"/><text x="368" y="174">3</text>
      <circle cx="488" cy="170" r="9"/><text x="488" y="174">4</text>
      <circle cx="540" cy="76" r="9"/><text x="540" y="80">5</text>
      <circle cx="540" cy="126" r="9"/><text x="540" y="130">6</text>
      <circle cx="779" cy="88" r="9"/><text x="779" y="92">7</text>
      <circle cx="651" cy="170" r="9"/><text x="651" y="174">8</text>
      <circle cx="775" cy="170" r="9"/><text x="775" y="174">9</text>
      <circle cx="675" cy="304" r="9"/><text x="675" y="308">10</text>
      <circle cx="859" cy="304" r="9"/><text x="859" y="308">11</text>
      <circle cx="765" cy="300" r="9"/><text x="765" y="304">12</text>
      <circle cx="921" cy="170" r="9"/><text x="921" y="174">13</text>
    </g>
  </g>

  <text x="20" y="418" font-size="11.5" fill="#4b5563">점선은 읽기 전용 호출이다. 번호의 뜻은 설계서 STEP 05 본문의 표에 있다.</text>
</svg>
