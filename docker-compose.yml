# 로컬 개발용. 포트 규칙은 docs/dev-env.md 참고
services:
  postgres:
    image: postgres:17
    container_name: meettoticket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meettoticket}
      POSTGRES_USER: ${POSTGRES_USER:-meettoticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meettoticket}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: meettoticket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-meettoticket}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-meettoticket}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  rabbitmq-data:
