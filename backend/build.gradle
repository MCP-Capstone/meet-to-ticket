plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mcpcapstone'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// 스키마는 Flyway 마이그레이션(db/migration)으로만 변경한다. PostgreSQL 지원 모듈이 따로 필요하다.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// 비밀번호 해시(BCrypt)만 사용한다. Spring Security 전체는 쓰지 않는다.
	implementation 'org.springframework.security:spring-security-crypto'
	// API 명세 (Swagger UI: /swagger-ui.html). 3.x가 Spring Boot 4를 지원한다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ./gradlew bootRun은 기본으로 local 프로파일을 쓴다(기본 자격증명 허용). jar 실행은 시작 가드가 적용된다.
// --args 또는 SPRING_PROFILES_ACTIVE로 프로파일을 지정하면 그 값이 우선한다.
tasks.named('bootRun') {
	if (System.getenv('SPRING_PROFILES_ACTIVE') == null) {
		systemProperty 'spring.profiles.active', 'local'
	}
}
