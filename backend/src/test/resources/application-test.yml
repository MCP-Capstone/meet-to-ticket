spring:
  datasource:
    url: jdbc:h2:mem:meettoticket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    # 마이그레이션은 PostgreSQL 전용 SQL이라 H2 테스트는 엔티티로 스키마를 만든다.
    # 마이그레이션 검증은 MigrationSchemaTest(PostgreSQL 필요)가 한다.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
agent:
  mode: mock
app:
  analysis:
    scheduling-enabled: false
    queue-listener-enabled: false
  demo:
    enabled: true
