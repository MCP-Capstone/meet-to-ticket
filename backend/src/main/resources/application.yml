server:
  port: 8080
  servlet:
    session:
      # 로그인 세션 유지 시간 (JSESSIONID 쿠키)
      timeout: 2h

spring:
  application:
    name: backend
  datasource:
    # 기본값은 루트 docker-compose.yml의 PostgreSQL과 같다. 바꾸려면 환경 변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meettoticket}
    username: ${DB_USERNAME:meettoticket}
    password: ${DB_PASSWORD:meettoticket}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}
  jpa:
    hibernate:
      # 개발 단계라 엔티티 기준으로 테이블을 자동 생성/갱신한다.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

springdoc:
  # Spring 공개 API만 문서화한다. Agent의 /runs는 Agent 서버의 /docs에서 제공한다.
  paths-to-match: /api/**
  default-produces-media-type: application/json
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

agent:
  # Agent(FastAPI) 주소. 포트 규칙은 docs/dev-env.md 참고
  base-url: ${AGENT_BASE_URL:http://localhost:8001}
  mode: ${AGENT_MODE:live}
  api-key: ${AGENT_INTERNAL_API_KEY:}
  poll-interval-ms: ${AGENT_POLL_INTERVAL_MS:2000}
  connect-timeout: 3s
  read-timeout: 5s
  task-timeout: ${AGENT_TASK_TIMEOUT:10m}
  mock-scenario: ${AGENT_MOCK_SCENARIO:approved}
