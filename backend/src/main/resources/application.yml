server:
  port: 8080
  servlet:
    session:
      # 로그인 세션 유지 시간 (JSESSIONID 쿠키)
      timeout: 2h

spring:
  application:
    name: backend
  task:
    scheduling:
      # 기본은 스레드 1개라 느린 주기 작업 하나가 분석 디스패치와 outbox 릴레이까지 막는다.
      pool:
        size: 4
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:meettoticket}
    password: ${RABBITMQ_PASSWORD:meettoticket}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
        # Agent/DB 재시도는 각각의 호출에 한정한다. 처리 실패는 DLQ로 보내 무한 재전달을 막는다.
        default-requeue-rejected: false
        retry:
          enabled: false
  datasource:
    # 기본값은 루트 docker-compose.yml의 PostgreSQL과 같다. 바꾸려면 환경 변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meettoticket}
    username: ${DB_USERNAME:meettoticket}
    password: ${DB_PASSWORD:meettoticket}
  flyway:
    # 빈 DB는 V1부터 적용한다. ddl-auto: update로 만들어진 기존 DB(이력 테이블 없음)는 V1을 적용된 것으로 기록하고 V2부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}
  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 엔티티와 일치하는지 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

springdoc:
  # Spring 공개 API만 문서화한다. Agent의 /runs는 Agent 서버의 /docs에서 제공한다.
  paths-to-match: /api/**
  default-produces-media-type: application/json
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

agent:
  # Agent(FastAPI) 주소. 포트 규칙은 docs/dev-env.md 참고
  base-url: ${AGENT_BASE_URL:http://localhost:8001}
  mode: ${AGENT_MODE:live}
  api-key: ${AGENT_INTERNAL_API_KEY:}
  poll-interval-ms: ${AGENT_POLL_INTERVAL_MS:2000}
  connect-timeout: 3s
  read-timeout: 5s
  connection-read-timeout: 45s
  task-timeout: ${AGENT_TASK_TIMEOUT:10m}
  mock-scenario: ${AGENT_MOCK_SCENARIO:draft}

app:
  github:
    # 가입 시 GitHub 계정 존재 확인에 쓴다. 토큰 없이 호출한다(IP당 시간당 60회 제한).
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    timeout: 3s
  analysis:
    submitting-timeout: ${ANALYSIS_SUBMITTING_TIMEOUT:2m}
    failure-reconcile-interval-ms: ${ANALYSIS_FAILURE_RECONCILE_INTERVAL_MS:5000}
  publish:
    # 이 시간 안에 Agent 발행 결과가 오지 않으면 묶음을 결과 모름으로 끝낸다.
    result-timeout: ${PUBLISH_RESULT_TIMEOUT:30m}
    expire-interval-ms: ${PUBLISH_EXPIRE_INTERVAL_MS:60000}
    # 티켓이 더 이상 기다리지 않는데 RESERVED/SENT로 남은 발행 기록을 정리한다 (#263, docs/publications.md).
    recovery:
      enabled: ${PUBLISH_RECOVERY_ENABLED:true}
      interval-ms: ${PUBLISH_RECOVERY_INTERVAL_MS:300000}
      stale-after: ${PUBLISH_RECOVERY_STALE_AFTER:10m}
      batch-size: ${PUBLISH_RECOVERY_BATCH_SIZE:100}
